<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione Medico</title>
</head>
<body>

<h2>Registrazione Medico</h2>

<form id="registerForm">

    <input type="text" id="nome" placeholder="Nome" required>
    <input type="text" id="cognome" placeholder="Cognome" required>

    <button type="button" onclick="registerDoctor()">
        Connetti MetaMask e registra
    </button>

</form>

<p id="status"></p>

<script>

let currentWallet = null;

// -----------------------------
// CONNETTI METAMASK (FIX DEFINITIVO)
// -----------------------------
async function connectWallet() {
    if (!window.ethereum) {
        alert("Installa MetaMask");
        return null;
    }

    try {
        // 🔥 FORZA APERTURA POPUP META MASK
        await window.ethereum.request({
            method: "wallet_requestPermissions",
            params: [{ eth_accounts: {} }]
        });

        const accounts = await window.ethereum.request({
            method: "eth_accounts"
        });

        if (!accounts || accounts.length === 0) {
            alert("Nessun account selezionato");
            return null;
        }

        currentWallet = accounts[0];
        console.log("Wallet connesso:", currentWallet);

        return currentWallet;

    } catch (error) {
        console.error("Errore MetaMask:", error);
        alert("Connessione MetaMask fallita o annullata");
        return null;
    }
}

// -----------------------------
// ASCOLTA CAMBIO ACCOUNT
// -----------------------------
if (window.ethereum) {
    window.ethereum.on("accountsChanged", (accounts) => {
        if (!accounts || accounts.length === 0) {
            currentWallet = null;
            document.getElementById("status").innerText =
                "Wallet disconnesso";
        } else {
            currentWallet = accounts[0];
            document.getElementById("status").innerText =
                "Wallet attivo: " + currentWallet;
        }
    });
}

// -----------------------------
// EMAIL AUTOMATICA
// -----------------------------
function generateEmail(nome, cognome) {
    return `${nome.toLowerCase()}.${cognome.toLowerCase()}@test.com`;
}

// -----------------------------
// PASSWORD RANDOM
// -----------------------------
function generatePassword() {
    return Math.random().toString(36).slice(-10);
}

// -----------------------------
// REGISTRAZIONE MEDICO
// -----------------------------
async function registerDoctor() {

    const nome = document.getElementById("nome").value;
    const cognome = document.getElementById("cognome").value;

    if (!nome || !cognome) {
        alert("Compila tutti i campi");
        return;
    }

    const wallet = await connectWallet();
    if (!wallet) return;

    const email = generateEmail(nome, cognome);
    const password = generatePassword();

    try {
        const response = await fetch("/api/register-doctor", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nome: nome,
                cognome: cognome,
                email: email,
                password: password,
                role: "DOCTOR",
                wallet_address: wallet
            })
        });

        const data = await response.json();

        document.getElementById("status").innerText =
            response.ok
                ? `Registrazione OK\nEmail: ${email}\nPassword: ${password}\nWallet: ${wallet}`
                : "Errore: " + (data.error || "server error");

    } catch (err) {
        console.error("Errore fetch:", err);
        document.getElementById("status").innerText =
            "Errore di connessione al server";
    }
}

</script>

</body>
</html>
