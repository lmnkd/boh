<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione Medico</title>
</head>
<body>

<h2>Registrazione Medico</h2>

<form id="registerForm">

    <input type="text" id="nome" placeholder="Nome" required>
    <input type="text" id="cognome" placeholder="Cognome" required>

    <button type="button" onclick="registerDoctor()">
        Connetti MetaMask e registra
    </button>

</form>

<p id="status"></p>

<script>

// -----------------------------
// CONNECT METAMASK
// -----------------------------
async function connectWallet() {
    if (!window.ethereum) {
        alert("Installa MetaMask");
        return null;
    }

    const accounts = await window.ethereum.request({
        method: "eth_requestAccounts"
    });

    return accounts[0];
}

// -----------------------------
// GENERA EMAIL AUTOMATICA
// -----------------------------
function generateEmail(nome, cognome) {
    return `${nome.toLowerCase()}.${cognome.toLowerCase()}@test.com`;
}

// -----------------------------
// GENERA PASSWORD RANDOM
// -----------------------------
function generatePassword() {
    return Math.random().toString(36).slice(-10);
}

// -----------------------------
// REGISTRAZIONE
// -----------------------------
async function registerDoctor() {

    const nome = document.getElementById("nome").value;
    const cognome = document.getElementById("cognome").value;

    if (!nome || !cognome) {
        alert("Compila tutti i campi");
        return;
    }

    // 🔥 CONNETTI WALLET
    const wallet = await connectWallet();
    if (!wallet) return;

    const email = generateEmail(nome, cognome);
    const password = generatePassword();

    // -----------------------------
    // INVIO BACKEND
    // -----------------------------
    const response = await fetch("/api/register-doctor", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            nome: nome,
            cognome: cognome,
            email: email,
            password: password,
            role: "DOCTOR",
            wallet_address: wallet   // 🔥 FIX IMPORTANTE
        })
    });

    const data = await response.json();

    document.getElementById("status").innerText =
        response.ok
        ? `Registrazione OK\nEmail: ${email}\nPassword: ${password}\nWallet: ${wallet}`
        : "Errore: " + (data.error || "server error");
}

</script>

</body>
</html>
