<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione Medico</title>
</head>
<body>

<h2>Registrazione Medico</h2>

<form id="registerForm">

    <input type="text" id="nome" placeholder="Nome" required>
    <input type="text" id="cognome" placeholder="Cognome" required>

    <button type="button" onclick="registerDoctor()">
        Registra Medico
    </button>

</form>

<p id="status"></p>

<script>

// -----------------------------
// EMAIL AUTOMATICA
// -----------------------------
function generateEmail(nome, cognome) {
    return `${nome.toLowerCase()}.${cognome.toLowerCase()}@test.com`;
}

// -----------------------------
// PASSWORD RANDOM
// -----------------------------
function generatePassword() {
    return Math.random().toString(36).slice(-10);
}

// -----------------------------
// REGISTRAZIONE MEDICO
// -----------------------------
async function registerDoctor() {

    const nome = document.getElementById("nome").value.trim();
    const cognome = document.getElementById("cognome").value.trim();

    if (!nome || !cognome) {
        alert("Compila tutti i campi");
        return;
    }

    const email = generateEmail(nome, cognome);
    const password = generatePassword();

    try {
        const response = await fetch("/api/register-doctor", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nome: nome,
                cognome: cognome,
                email: email,
                password: password,
                role: "DOCTOR"
            })
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById("status").innerText =
                `Registrazione OK\n` +
                `Email: ${email}\n` +
                `Password: ${password}\n` +
                `Wallet: ${data.wallet_address}`;
        } else {
            document.getElementById("status").innerText =
                "Errore: " + (data.error || "server error");
        }

    } catch (err) {
        console.error("Errore fetch:", err);
        document.getElementById("status").innerText =
            "Errore di connessione al server";
    }
}

</script>

</body>
</html>
